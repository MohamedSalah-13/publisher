# Build every native package before publishing a version-tagged GitHub Release.
# The tag must match the version in pom.xml (v1.2.0 <-> 1.2.0).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.2.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  installers:
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

  publish:
    needs: installers
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      - name: Publish the release
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* --verify-tag --title "Hamza Publisher ${TAG#v}" --generate-notes
          fi
