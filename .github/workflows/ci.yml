# Runs the test suite on every push to main and on pull requests.
#
# The regular test job runs on Windows so that it exercises DPAPI encryption.
# A change that only touches docs/ or Markdown files skips the run, since there is nothing to test.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      build_installers:
        description: Build native installers on all supported platforms
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.build_installers }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: ./mvnw.cmd -B test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  installers:
    if: ${{ inputs.build_installers }}
    uses: ./.github/workflows/package.yml
